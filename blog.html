<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="blog-page">
    <a href="index.html">Back</a>

    <h1 id="title">The start</h1>
    <p id="date">02-09-2026</p>
    <div id="content"></div>
    <button class="share-button" id="share-button" type="button">Share</button>
  </main>

  <div class="share-popup" id="share-popup" hidden>
    <div class="share-backdrop" data-close-share></div>
    <section class="share-panel" role="dialog" aria-modal="true" aria-labelledby="share-title">
      <button class="share-close" type="button" aria-label="Close share menu" data-close-share>&times;</button>
      <h2 id="share-title">Share this blog</h2>
      <div class="share-options">
        <button type="button" data-share-action="copy">Copy link</button>
        <button type="button" data-share-action="whatsapp">WhatsApp</button>
        <button type="button" data-share-action="snapchat">Snapchat</button>
        <button type="button" data-share-action="more">More sharing options</button>
      </div>
      <p class="share-status" id="share-status" aria-live="polite"></p>
    </section>
  </div>

  <script>
    const posts = {
      "the-start": {
        title: "The start",
        date: "02-09-2026",
        text: [
          "The schoolyear just started for me and i got a newer, more powerful laptop, so the first thing i do is check hackclub.",
          "I wasn't super exited for the new schoolyear, but i was happy to see my friends.",
          "This was my first blog, hope ya like it."
        ],
        image: "https://tse4.mm.bing.net/th/id/OIP.1LYRZpvKfCrtrK3bxLjF3wHaFR?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
      },
      "good-news": {
        title: "Good news!",
        date: "03-09-2026",
        text: [
          "Hey everyone! I have some exciting news to share with you all.",
          "We were coding in STEAM class and i decided to propose a hackclub club to my teacher.",
          "He didn't know what a hackclub is, so i said i will mail all the info, so maybe, just maybe, we will have a hackclub at school!"
        ],
        image: "https://www.pngmart.com/files/22/Meme-Emojis-PNG.png"
      },
      "its-thursday": {
        title: "It's thursday!",
        date: "03-09-2026",
        text: [
          "I am writing this very early in the morning before school so please don't expect too much.",
          "First week of school is already almost over!",
          "Now i just need to survive french class 2 more days and its the weekend!"
        ],
        image: "https://cdn3.emoji.gg/emojis/84579-joobi-mewing-yellow.png"
      },
      "oopsies": {
        title: "Oopsies...",
        date: "07-09-2026",
        text: [
          "Hi everyone, uhm.... i don't know how to say this...",
          "I shipped this site a few days ago.",
          "And i waited, and waited, and waited, for days in the queue.",
          "then i got a review, they liked my site!",
          "But.... i forgot a readme.md file in my repo.",
          "So i made it and reshipped, i hope i get accepted now."
        ],
        image: "https://tse2.mm.bing.net/th/id/OIP.sBDLmUsgvH23GkoOU3hjZwAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const post = posts[params.get("post") || "the-start"];
    const rainbowLikedSite = true;

    function rainbowPhrase(phrase) {
      if (!rainbowLikedSite) return phrase;

      return Array.from(phrase).map((letter, index) =>
        `<span class="rainbow-letter" style="--letter-index: ${index}">${letter === " " ? "&nbsp;" : letter}</span>`
      ).join("");
    }

    if (post) {
      document.getElementById("title").textContent = post.title;
      document.getElementById("date").textContent = post.date;
      document.getElementById("content").innerHTML =
        post.text.map(p => p.includes("they liked my site!")
          ? `<p>${p.replace("they liked my site!", rainbowPhrase("they liked my site!"))}</p>`
          : `<p>${p}</p>`).join("") +
        (post.image ? `<div class="pics"><img src="${post.image}" alt=""></div>` : "");
    }

    const sharePopup = document.getElementById("share-popup");
    const shareTitle = document.getElementById("share-title");
    const shareStatus = document.getElementById("share-status");
    const shareUrl = window.location.href;

    document.getElementById("share-button").addEventListener("click", () => {
      shareTitle.textContent = `Share ${post.title}`;
      shareStatus.textContent = "";
      sharePopup.hidden = false;
    });

    document.querySelectorAll("[data-close-share]").forEach(element => {
      element.addEventListener("click", () => {
        sharePopup.hidden = true;
      });
    });

    document.querySelectorAll("[data-share-action]").forEach(button => {
      button.addEventListener("click", async () => {
        const message = `Check out this blog: ${shareUrl}`;

        if (button.dataset.shareAction === "copy") {
          try {
            await navigator.clipboard.writeText(shareUrl);
            shareStatus.textContent = "Link copied!";
          } catch {
            shareStatus.textContent = "Copy failed. You can use More sharing options.";
          }
        } else if (button.dataset.shareAction === "whatsapp") {
          window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, "_blank");
        } else if (button.dataset.shareAction === "snapchat") {
          window.open(`https://www.snapchat.com/scan?attachment=${encodeURIComponent(shareUrl)}`, "_blank");
        } else if (navigator.share) {
          await navigator.share({ title: shareTitle.textContent, url: shareUrl });
        } else {
          shareStatus.textContent = "More sharing options are not supported here.";
        }
      });
    });
  </script>
</body>
</html>
